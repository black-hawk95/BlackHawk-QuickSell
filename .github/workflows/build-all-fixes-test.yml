name: Build QuickSell all-fixes test

on:
  workflow_dispatch:
  push:
    branches:
      - test/all-fixes-build
      - fix/single-dll-v4
    paths:
      - ".github/workflows/build-all-fixes-test.yml"
      - "tools/TestFixes/**"
      - "tools/Patcher/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build runtime fixes helper
        run: dotnet build tools/TestFixes/QuickSell.TestFixes.csproj -c Release

      - name: Build binary patcher
        run: dotnet build tools/Patcher/Patcher.csproj -c Release

      - name: Download current QuickSell package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work package
          gh release download v3.4.0 \
            --repo black-hawk95/BlackHawk-QuickSell \
            --pattern "QuickSell.spt.4.1.port.v3.4.0.zip" \
            --dir work
          unzip -q work/QuickSell.spt.4.1.port.v3.4.0.zip -d package

      - name: Apply all test fixes
        shell: bash
        run: |
          QUICKSELL_DLL="$(find package -type f -name QuickSell.dll -print -quit)"
          SERVER_DLL="$(find package -type f -name BlackHawk.QuickSell.Server.dll -print -quit)"
          if [ -z "$QUICKSELL_DLL" ] || [ -z "$SERVER_DLL" ]; then
            echo "QuickSell client or server DLL not found in release package"
            exit 1
          fi

          HELPER_DLL="tools/TestFixes/bin/Release/netstandard2.1/QuickSell.TestFixes.dll"
          PATCHER_DLL="tools/Patcher/bin/Release/net8.0/Patcher.dll"

          dotnet "$PATCHER_DLL" "$QUICKSELL_DLL" "$HELPER_DLL" "$SERVER_DLL" 4.0.1
          dotnet "$PATCHER_DLL" --verify "$QUICKSELL_DLL" 4.0.1
          test "$(find "$(dirname "$QUICKSELL_DLL")" -maxdepth 1 -name '*.dll' | wc -l)" -eq 1

          cat > package/TEST-BUILD.txt <<'EOF'
          QuickSell v4.0.1 - single client DLL TEST BUILD

          Included test changes:
          - Suppress QuickSell price tooltip on trader-owned inventory items to avoid Int32 overflow console spam.
          - F12 option: "Play sell sound for each item".
          - F12 option: "Allow flea market selling" blocks both QuickSell offers and normal flea-page listings.
          - F12 option: "Refresh flea prices (key)" binds an optional menu-only hotkey to the existing refresh action.
          - Tooltips automatically recalculate when an item's attachments or stack counts change.
          - Trader tooltip and confirmation include attached component prices and invalidate when attachments change.
          - Composite flea pricing uses the game's item tree to include nested attachments in sale confirmation and tooltips.
          - Flea confirmation uses long IL branches so the patched method can run.

          This is a test build. It has not been merged into main. Remove the old QuickSell.TestFixes.dll when upgrading from v4.0.0.
          EOF

      - name: Package test build
        run: |
          cd package
          zip -qr ../QuickSell-v4.0.1-single-dll-test.zip .
          cd ..
          ls -lh QuickSell-v4.0.1-single-dll-test.zip

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSell-v4.0.1-single-dll-test
          path: QuickSell-v4.0.1-single-dll-test.zip
          if-no-files-found: error
